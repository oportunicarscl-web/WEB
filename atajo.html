<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registrar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efe3">
<meta name="robots" content="noindex">
<title>Registrar movimiento · Oportunicars</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23f6efe3'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='%23d98324' font-family='Arial' font-weight='700'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-1:#fff;--bg-2:#f6efe3;--ink:#3b2f21;--mut:rgba(59,47,33,.62);--line:#b4935f;--soft:rgba(180,147,95,.35);--camel:#8c6d3f;--card:rgba(255,255,255,.82);--acc:#d98324;--acc-ink:#fff;--in:#2f7d4f;--out:#b3402a;--warn:#9a5b00;--hand:'Caveat','Segoe Print','Bradley Hand',cursive;--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-2)}
body{margin:0;color:var(--ink);font:15px/1.4 var(--mono);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
 background-color:var(--bg-2);background-image:linear-gradient(rgba(180,147,95,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(180,147,95,.10) 1px,transparent 1px),linear-gradient(rgba(180,147,95,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(180,147,95,.22) 1px,transparent 1px),radial-gradient(ellipse at 36% 46%,var(--bg-1),var(--bg-2) 78%);background-size:20px 20px,20px 20px,100px 100px,100px 100px,100% 100%}
main{max-width:520px;margin:0 auto}
h1{font:600 1.7rem/1 var(--hand);margin:0;color:var(--camel)}h2{font:600 1.8rem/1.05 var(--hand);margin:4px 0 14px}
.brand{font-size:.62rem;letter-spacing:.18em;color:var(--mut);margin:0 0 2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;border-bottom:1px solid var(--soft);padding-bottom:8px}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--mut);padding:8px 2px;text-decoration:underline;font-size:.72rem}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;line-height:1.1;text-align:center;min-height:68px;backdrop-filter:blur(4px)}
.tile span{font-size:1.5rem;line-height:1}
.tile:active{transform:scale(.96);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;backdrop-filter:blur(4px)}
.opts{display:grid;gap:10px}
.opt{background:var(--bg-1);border:1px solid var(--line);border-radius:6px;padding:15px;text-align:left;font:inherit;font-size:.95rem}
.opt.sel{border:2px solid var(--acc);background:#fff7ea}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big .opt{text-align:center;font-weight:500;padding:26px 8px}
.in{color:var(--in)}.out{color:var(--out)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password]{width:100%;font:inherit;padding:13px;border-radius:6px;border:1px solid var(--line);background:var(--bg-1);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
input.amount{font-size:1.9rem;font-weight:500;text-align:center;padding:16px}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;padding:14px;border-radius:6px;border:1px solid var(--line);background:var(--bg-1);font-weight:500}
.nav .primary,button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.nav button:disabled{opacity:.4}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--soft)}.steps i.on{background:var(--acc)}
.sum{display:grid;gap:6px;margin:10px 0}.sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--soft);padding:8px 0}.sum small{color:var(--mut)}
.msg{color:var(--warn);min-height:1.2em;margin:8px 0 0;font-size:.82rem}
.ok{text-align:center;padding:30px 10px}.ok b{font-size:3rem;display:block;color:var(--in)}
.list{max-height:46vh;overflow:auto;display:grid;gap:8px;margin-top:10px}
small.m{color:var(--mut)}
.foot{text-align:center;margin-top:18px}
</style>
</head>
<body>
<main id="app"><p>Cargando…</p></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.102.0';
const ENDPOINT='https://script.google.com/macros/s/AKfycbypxLeRAH7PNQCAfYV14_V_cSbp5soxaX07vxDbyt8HV8efn1W7cPIKXR_XMut6cz-k/exec';
const client=createClient('https://lxyqosqgvkgjybgffdob.supabase.co','sb_publishable_1J_TfuzcCqaqtDVDIaiLAw_uCufZXHC',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'oc-atajo-auth'}});
// La primera vez en cada teléfono pide usuario y clave; después la sesión dura hasta 60 días sin volver a entrar.
const SESSION_DAYS=60,STAMP='oc-atajo-since';
const stamp=()=>{try{return Number(localStorage.getItem(STAMP))||0;}catch{return 0;}};
const expired=()=>Date.now()-stamp()>SESSION_DAYS*86400000;
const $=id=>document.getElementById(id),app=$('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// Botones fijos: cada uno va amarrado a un concepto exacto de CONCEPTOS_CAJA y deja un comentario automático.
// Recorrido de todos: patente → monto → forma de pago → guardar. «ask» obliga a escribir el detalle.
const TILES=[
 {icon:'⛽',label:'Combustible',concept:'Arreglo de auto',note:'Combustible',dir:'SALIDA'},
 {icon:'🚿',label:'Lavado',concept:'Arreglo de auto',note:'Lavado',dir:'SALIDA'},
 {icon:'🔧',label:'Arreglo',concept:'Arreglo de auto',note:'',ask:true,dir:'SALIDA'},
 {icon:'🛣️',label:'Permiso circ. / TAG',concept:'Arreglo de auto',note:'Peaje / Permiso',dir:'SALIDA'},
 {icon:'🅿️',label:'Estaciona\u00ADmiento',concept:'Arreglo de auto',note:'Estacionamiento',dir:'SALIDA'},
 {icon:'📷',label:'Fotos',concept:'Arreglo de auto',note:'Fotos',dir:'SALIDA'},
 {icon:'📣',label:'Publicación',concept:'Arreglo de auto',note:'Publicación',dir:'SALIDA'},
 {icon:'🚗',label:'Compra de auto',concept:'Compra de auto',note:'',dir:'SALIDA'},
 {icon:'💰',label:'Venta de auto',concept:'Venta de auto',note:'',dir:'ENTRADA'},
 {icon:'📝',label:'Transfe\u00ADrencia',concept:'Arreglo de auto',note:'Transferencia',dir:'SALIDA'},
 {icon:'🤝',label:'Reserva / abono',concept:'Venta de auto',note:'Reserva',dir:'ENTRADA'},
 {icon:'💸',label:'Pago a comisión',concept:'Arreglo de auto',note:'Pago a comisión',dir:'SALIDA'}
];
let data=null,token=null,form,step,msg='',done=null,busy=false;
const blank=()=>({tile:'',askNote:false,direction:'',conceptId:'',conceptSet:false,vehicleId:'',vehicleSet:false,amount:'',accountId:'',date:'',note:'',requestId:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))});
const concept=()=>data.concepts.find(c=>c.id===form.conceptId);
const needsCar=()=>!!concept()?.vehicleOperation;
// Pasos según lo ya respondido: dirección → concepto → auto (si corresponde) → monto → cuenta → resumen.
const order=()=>[...(form.tile&&form.conceptSet?[]:['direction','concept']),...(needsCar()?['car']:[]),'amount','account','review'];
const answered=k=>({direction:!!form.direction,concept:form.conceptSet,car:form.vehicleSet,amount:Number(form.amount)>0,account:!!form.accountId,review:false}[k]);
function save(){try{localStorage.setItem('oc-atajo-data',JSON.stringify(data));}catch{}}
async function call(action,payload={}){
 const {data:s}=await client.auth.getSession();if(!s.session||!stamp()||expired()){if(s.session)await client.auth.signOut();throw Error('SIN_SESION');}token=s.session.access_token;
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,action,token}),credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer'});
 const j=await r.json();if(!j.ok)throw Error(j.error||'No se pudo guardar.');return j.data;
}
const amountOk=()=>Number(form.amount)>0&&(!form.askNote||!!form.note.trim());
function go(k){step=k;msg='';render();}
function next(){const o=order(),i=o.indexOf(step);go(o[Math.min(o.length-1,i+1)]);}
function back(){const o=order(),i=o.indexOf(step);if(i>0)go(o[i-1]);}
function reset(){form=blank();form.date=data?.today||'';step='home';done=null;msg='';render();}
function pickTile(t){
 form=blank();form.date=data.today;form.direction=t.dir;form.tile=t.label;form.note=t.note;form.askNote=!!t.ask;
 // Concepto exacto por nombre (sin tildes ni mayúsculas); si no está en la caja, se elige a mano.
 const want=norm(t.concept),c=data.concepts.find(c=>norm(c.name).trim()===want);
 if(c){form.conceptId=c.id;form.conceptSet=true;}
 step=c?(needsCar()?'car':'amount'):'concept';
 render();if(!c){msg=`No encontré el concepto «${t.concept}» en la caja. Elígelo de la lista.`;render();}
}
function header(title){return `<header><div><p class="brand">OPORTUNICARS · CAJA</p><h1>${esc(title)}</h1></div><button class="link" id="again">Borrar y empezar de nuevo</button></header>`;}
function bar(){const o=order(),i=o.indexOf(step);return `<div class="steps">${o.map((k,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div>`;}
function nav(canNext,label){return `<div class="nav"><button id="back">← Atrás</button><button id="next" class="primary" ${canNext?'':'disabled'}>${label||'Siguiente →'}</button></div><p class="msg">${esc(msg)}</p>`;}
function render(){
 if(!data){app.innerHTML='<p>Cargando…</p>';return;}
 if(done){app.innerHTML=`<div class="card ok"><b>✓</b><h2>Guardado</h2><p>${esc(done)}</p><div class="nav"><button class="primary" id="newone">Registrar otro</button></div></div>`;$('newone').onclick=reset;return;}
 if(step==='home'){
  app.innerHTML=`<header><div><p class="brand">OPORTUNICARS · CAJA</p><h1>Registrar movimiento</h1></div></header><div class="tiles">${TILES.map((t,i)=>`<button class="tile" data-t="${i}"><span>${t.icon}</span>${esc(t.label)}</button>`).join('')}</div><div class="card"><p style="margin:0 0 12px">¿Entró o salió dinero?</p><div class="big"><button class="opt in" data-d="ENTRADA">⬇ Entró</button><button class="opt out" data-d="SALIDA">⬆ Salió</button></div></div><p class="foot"><button class="link" id="out">Cerrar sesión</button></p>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>pickTile(TILES[b.dataset.t]));
  $('out').onclick=async()=>{await client.auth.signOut();try{localStorage.removeItem(STAMP);}catch{}location.reload();};
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{form=blank();form.date=data.today;form.direction=b.dataset.d;step='concept';render();});
  return;
 }
 let body='';
 if(step==='direction')body=`<h2>¿Entró o salió dinero?</h2><div class="big"><button class="opt in ${form.direction==='ENTRADA'?'sel':''}" data-d="ENTRADA">⬇ Entró</button><button class="opt out ${form.direction==='SALIDA'?'sel':''}" data-d="SALIDA">⬆ Salió</button></div>`+nav(!!form.direction);
 if(step==='concept'){
  const list=data.concepts.filter(c=>form.direction==='ENTRADA'?c.nature!=='GASTO'&&c.nature!=='COSTO':c.nature!=='INGRESO');
  body=`<h2>Concepto</h2><input type="search" id="q" placeholder="Buscar concepto"><div class="list" id="list"></div>`+nav(form.conceptSet);
  app.innerHTML=header(form.tile||'Registrar')+bar()+`<div class="card">${body}</div>`;
  const draw=()=>{const q=norm($('q').value);$('list').innerHTML=`<button class="opt ${form.conceptSet&&!form.conceptId?'sel':''}" data-c="">Concepto por asignar</button>`+list.filter(c=>!q||norm(c.name+' '+c.category).includes(q)).map(c=>`<button class="opt ${form.conceptId===c.id?'sel':''}" data-c="${esc(c.id)}">${esc(c.name)}<br><small class="m">${esc(c.category)}</small></button>`).join('');
   $('list').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{form.conceptId=b.dataset.c;form.conceptSet=true;form.vehicleId='';form.vehicleSet=false;next();});};
  $('q').oninput=draw;draw();wireCommon();return;
 }
 if(step==='car'){
  body=`<h2>¿Qué auto?</h2><input type="search" id="q" placeholder="Patente, marca o modelo" autocomplete="off"><div class="list" id="list"></div>`+nav(form.vehicleSet);
  app.innerHTML=header(form.tile||'Registrar')+bar()+`<div class="card">${body}</div>`;
  const draw=()=>{const q=norm($('q').value).replace(/\s+/g,'');const hits=data.inventory.filter(v=>!q||norm([v.patente,v.marca,v.modelo,v.version].join('')).includes(q)).slice(0,40);
   $('list').innerHTML=`<button class="opt ${form.vehicleSet&&!form.vehicleId?'sel':''}" data-v="">Patente por asignar</button>`+hits.map(v=>`<button class="opt ${form.vehicleId===v.id?'sel':''}" data-v="${esc(v.id)}"><b>${esc(v.patente||'Sin patente')}</b> · ${esc([v.marca,v.modelo].filter(Boolean).join(' '))}</button>`).join('');
   $('list').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{form.vehicleId=b.dataset.v;form.vehicleSet=true;next();});};
  $('q').oninput=draw;draw();wireCommon();return;
 }
 if(step==='amount')body=`<h2>${form.direction==='ENTRADA'?'¿Cuánto entró?':'¿Cuánto fue?'}</h2><input class="amount" id="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="$0" value="${form.amount?money(Number(form.amount)):''}"><label style="display:block;margin-top:12px"><small class="m">${form.askNote?'Detalle':'Comentario'}${form.askNote?'':' (opcional)'}</small><input type="text" id="note" maxlength="120" value="${esc(form.note)}" placeholder="${form.askNote?'¿Qué se hizo? (obligatorio)':'Ej. proveedor, detalle'}"></label>`+nav(amountOk());
 if(step==='account'){body=`<h2>${form.direction==='ENTRADA'?'¿A qué cuenta llegó?':'¿Con qué pagaste?'}</h2><div class="opts">${data.accounts.map(a=>`<button class="opt ${form.accountId===a.id?'sel':''}" data-a="${esc(a.id)}">${esc(a.nombre)}</button>`).join('')}</div>`+nav(!!form.accountId);}
 if(step==='review'){const c=concept(),v=data.inventory.find(v=>v.id===form.vehicleId),a=data.accounts.find(a=>a.id===form.accountId);
  body=`<h2>Revisar y guardar</h2><div class="sum"><div><small>Tipo</small><b class="${form.direction==='ENTRADA'?'in':'out'}">${form.direction==='ENTRADA'?'Entró':'Salió'}</b></div><div><small>Concepto</small><b>${esc(c?c.name:'Por asignar')}</b></div>${needsCar()?`<div><small>Auto</small><b>${esc(v?v.patente||v.modelo:'Por asignar')}</b></div>`:''}<div><small>Monto</small><b>${money(Number(form.amount))}</b></div><div><small>Cuenta</small><b>${esc(a?.nombre||'')}</b></div><div><small>Fecha</small><input type="date" id="date" value="${esc(form.date)}" max="${esc(data.today)}" style="width:auto;padding:8px"></div>${form.note?`<div><small>Nota</small><b>${esc(form.note)}</b></div>`:''}</div>`+nav(!busy,busy?'Guardando…':'Guardar');}
 app.innerHTML=header(form.tile||'Registrar')+bar()+`<div class="card">${body}</div>`;
 wireCommon();
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{form.direction=b.dataset.d;form.conceptId='';form.conceptSet=false;next();});
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{form.accountId=b.dataset.a;next();});
 const amt=$('amt');if(amt){amt.oninput=()=>{const n=amt.value.replace(/\D/g,'').slice(0,10);form.amount=n;amt.value=n?money(Number(n)):'';$('next').disabled=!amountOk();};amt.focus();}
 const note=$('note');if(note)note.oninput=()=>{form.note=note.value;const n=$('next');if(n)n.disabled=!amountOk();};
 const date=$('date');if(date)date.onchange=()=>{form.date=date.value;};
}
function wireCommon(){
 const again=$('again');if(again)again.onclick=reset;
 const b=$('back');if(b)b.onclick=()=>{if(order().indexOf(step)===0){step='home';render();}else back();};
 const n=$('next');if(n)n.onclick=async()=>{if(step!=='review')return next();await submit();};
}
async function submit(){
 if(busy)return;busy=true;msg='';render();
 try{
  const r=await call('quick',{requestId:form.requestId,direction:form.direction,conceptId:form.conceptId,vehicleId:form.vehicleId,amount:Number(form.amount),accountId:form.accountId,date:form.date,note:form.note});
  const c=concept(),a=data.accounts.find(a=>a.id===form.accountId);
  done=`${form.direction==='ENTRADA'?'Entró':'Salió'} ${money(Number(form.amount))} · ${c?c.name:'concepto por asignar'}${form.note?' · '+form.note:''} · ${a?.nombre||''}`;
 }catch(e){msg=e.message==='SIN_SESION'?'Tu sesión venció. Abre admin.oportunicars.cl e inicia sesión.':e.message;}
 busy=false;render();
}
function loginView(err=''){
 app.innerHTML=`<div class="card"><h2>Inicia sesión</h2><p><small class="m">Solo la primera vez en este teléfono; después queda abierta hasta 60 días.</small></p><form id="lf" style="display:grid;gap:10px"><input type="text" id="em" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="Correo"><input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" style="width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><button class="opt sel" type="submit">Entrar</button></form><p class="msg">${esc(err)}</p></div>`;
 $('lf').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return loginView('Correo o contraseña incorrectos.');try{localStorage.setItem(STAMP,String(Date.now()));}catch{}location.reload();};
}
(async()=>{
 try{const c=JSON.parse(localStorage.getItem('oc-atajo-data'));if(c&&c.concepts){data=c;reset();}}catch{}
 try{
  data=await call('quickData');data.today=data.today||new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'});save();
  if(!form||step==='home'||!step)reset();else render();
 }catch(e){
  if(e.message==='SIN_SESION'){loginView();return;}
  if(!data)app.innerHTML='<div class="card"><h2>No se pudo cargar</h2><p>'+esc(e.message)+'</p><div class="nav"><button class="primary" onclick="location.reload()">Reintentar</button></div></div>';
 }
})();
</script>
</body>
</html>
